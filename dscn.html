<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login • Insides</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #fff;
      border: 1px solid #dbdbdb;
      padding: 40px 50px;
      width: 350px;
      text-align: center;
      border-radius: 10px;
    }

    h2 {
      font-weight: 600;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid #dbdbdb;
      border-radius: 5px;
      background-color: #fafafa;
    }

    input:focus {
      outline: none;
      border-color: #a8a8a8;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #0095f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #007bd1;
    }

    .forgot {
      margin: 15px 0;
      font-size: 13px;
    }

    .forgot a {
      color: #00376b;
      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    .register {
      margin-top: 20px;
      border: 1px solid #dbdbdb;
      padding: 20px;
      border-radius: 10px;
      background-color: #fff;
    }

    .register a {
      color: #0095f6;
      text-decoration: none;
      font-weight: 600;
    }

    .register a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div>
    <div class="container">
      <h2>Sign in to Insides</h2>
      <form>
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Log In</button>
      </form>

      <div class="forgot">
        <a href="#">Forgot password?</a>
      </div>
    </div>

    <div class="register">
      <p>Don't have an account? <a href="#">Register</a></p>
    </div>
  </div>

</body>
</html>
